name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  actions: read
  security-events: write
  statuses: write

jobs:
  ci:
    uses: chavdar12-projects/workflows/.github/workflows/ci.yml@v1
    with:
      codeql: '["c-cpp"]'
      build: 'cpp'
      # CMakeLists.txt requires CMake >= 4.3, newer than the runner image may ship
      setup: 'pip install "cmake>=4.3"'
