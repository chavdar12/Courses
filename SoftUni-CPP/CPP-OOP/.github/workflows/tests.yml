name: Build and Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      # Every lesson folder is its own CMake project: configure, build and test each one.
      - name: Build and test every lesson
        run: |
          status=0
          for dir in 0*/; do
            echo "::group::$dir"
            cmake -S "$dir" -B "build/$dir" -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined" \
              && cmake --build "build/$dir" -j \
              && ctest --test-dir "build/$dir" --output-on-failure -j || status=1
            echo "::endgroup::"
          done
          exit $status
        env:
          # several exercises intentionally never free (e.g. Company lists); only fail on real memory errors
          ASAN_OPTIONS: detect_leaks=0
