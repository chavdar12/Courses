name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      # Every module folder is its own solution; test them all and fail if any module fails.
      - name: Test every module
        run: |
          failed=0
          for module in 0*/; do
            echo "::group::${module%/}"
            dotnet test "$module" || failed=1
            echo "::endgroup::"
          done
          exit $failed
