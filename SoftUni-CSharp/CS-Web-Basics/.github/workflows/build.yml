name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Each module folder is a self-contained solution; building them one by one proves it.
      - name: Test every module
        run: |
          for sln in [0-9][0-9][0-9]-*/*.slnx; do
            echo "::group::$sln"
            dotnet test "$sln" --configuration Release --logger "console;verbosity=normal"
            echo "::endgroup::"
          done
