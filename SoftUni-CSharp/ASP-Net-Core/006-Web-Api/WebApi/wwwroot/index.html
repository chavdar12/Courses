<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Products</title>
</head>
<body>
<h1>Products</h1>
<ul id="products"></ul>
<form id="add">
    <label>Name <input name="name" required /></label>
    <label>Price <input name="price" type="number" step="0.01" min="0.01" required /></label>
    <button>Add</button>
</form>
<p id="error" role="alert"></p>
<script>
    // AJAX: talk to the Web API with fetch, re-render without a page reload.
    const list = document.getElementById('products');
    const error = document.getElementById('error');

    async function load() {
        const products = await (await fetch('/api/products')).json();
        list.replaceChildren(...products.map(p => {
            const li = document.createElement('li');
            li.textContent = `${p.name} - ${p.price.toFixed(2)}`;
            return li;
        }));
    }

    document.getElementById('add').addEventListener('submit', async e => {
        e.preventDefault();
        const form = new FormData(e.target);
        const response = await fetch('/api/products', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: form.get('name'), price: Number(form.get('price')) }),
        });
        error.textContent = response.ok ? '' : (await response.json()).title;
        if (response.ok) { e.target.reset(); await load(); }
    });

    load();
</script>
</body>
</html>
