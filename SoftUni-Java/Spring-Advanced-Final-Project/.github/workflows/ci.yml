name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  actions: read
  security-events: write
  statuses: write

jobs:
  ci:
    uses: chavdar12/workflows/.github/workflows/ci.yml@v2
    with:
      codeql: '["java-kotlin", "javascript-typescript"]'
      build: 'java node'

  e2e:
    needs: ci
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.ci.outputs.runner || 'k8s-runners' }}
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: |
          printf 'DB_PASSWORD=%s\nJWT_SECRET=%s\nKIBANA_PASSWORD=%s\nGELF_HOST=localhost\n' \
            "$(openssl rand -hex 16)" "$(openssl rand -base64 64 | tr -d '\n')" "$(openssl rand -hex 12)" > .env
          # the gateway and what it depends on (incl. Logstash/Elasticsearch for logging); Kibana is not needed
          docker compose up --build -d --wait gateway
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - working-directory: client
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: client/test-results/
