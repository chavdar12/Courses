name: Format

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: Java (google-java-format, AOSP style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Check formatting
        run: |
          curl -sSL -o "$RUNNER_TEMP/gjf.jar" \
            https://github.com/google/google-java-format/releases/download/v2.0.0/google-java-format-2.0.0-all-deps.jar
          git ls-files -z '*.java' | xargs -0 java -jar "$RUNNER_TEMP/gjf.jar" --aosp --skip-reflowing-long-strings --dry-run --set-exit-if-changed
