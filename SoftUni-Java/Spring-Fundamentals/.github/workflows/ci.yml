name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  actions: read
  security-events: write
  statuses: write

jobs:
  ci:
    uses: chavdar12/workflows/.github/workflows/ci.yml@v2
    with:
      codeql: '["java-kotlin"]'
      format: 'google-java-format'
      build: 'java node'
