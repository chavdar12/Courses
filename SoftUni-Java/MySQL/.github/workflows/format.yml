name: Format

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sql:
    name: SQL (SQLFluff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install sqlfluff==4.5.0
      - name: Check formatting (layout and capitalisation rules)
        run: sqlfluff lint --config .github/linters/.sqlfluff --rules layout,capitalisation --ignore parsing,lexing .
