<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Shelter</title>
    <link rel="stylesheet" href="/content/styles/site.css">
</head>
<body>
    <header>
        <nav>
            <ul class="navigation">
                <li><a href="/">Home Page</a></li>
                <li><a href="/cats/add-breed">Add Breed</a></li>
                <li><a href="/cats/add-cat">Add Cat</a></li>
            </ul>
        </nav>
        <h1>Cat Shelter</h1>

    </header>
    <main>
        <form action="/cats/shelter/{{id}}" method="POST" class="cat-form">
            <h2>Shelter the cat</h2>
            <img src="{{image}}" alt="{{name}}">
            <label for="name">Name</label>
            <input type="text" id="name" value="{{name}}" disabled>
            <label for="description">Description</label>
            <textarea id="description" disabled>{{description}}</textarea>
            <label for="group">Breed</label>
            <input type="text" id="group" value="{{breed}}" disabled>
            <button type="submit">Shelter the cat</button>
        </form>
    </main>
</body>
</html>
