<div class="card article-card m-2" style="width: 18rem;">
    <img class="card-img-top" src="{{ article.image_url }}" alt="{{ article.title }}">
    <div class="card-body">
        <h5 class="card-title">{{ article.title }}</h5>
        <p class="card-text">{{ article.description }}</p>
        <a href="{{ article.source.url }}" target="_blank" rel="noopener">{{ article.source.name }}</a>
    </div>
</div>
