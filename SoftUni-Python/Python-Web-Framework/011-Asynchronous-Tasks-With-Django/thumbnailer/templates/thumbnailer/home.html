<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thumbnailer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body class="container py-5">
    <h1>Image Thumbnailer</h1>
    {% if form %}
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary" type="submit">Make thumbnails</button>
        </form>
    {% else %}
        <p>Task <code>{{ task_id }}</code>: <strong id="status">{{ task_status }}</strong></p>
        <a id="download" class="btn btn-success d-none" href="#">Download thumbnails</a>
        <a class="btn btn-link" href="{% url 'home' %}">Upload another</a>
        <script>
            const poll = async () => {
                const data = await (await fetch("{% url 'task' task_id %}")).json();
                document.getElementById('status').textContent = data.task_status;
                if (data.task_status === 'SUCCESS') {
                    const link = document.getElementById('download');
                    link.href = data.results.archive_path;
                    link.classList.remove('d-none');
                } else if (data.task_status !== 'FAILURE') {
                    setTimeout(poll, 1000);
                }
            };
            poll();
        </script>
    {% endif %}
</body>
</html>
