{% extends 'base.html' %}
{% block content %}
    <div class="row">
        <div class="col-md-6">
            <img src="{{ pet.image_url }}" class="img-fluid rounded" alt="Photo of {{ pet.name }}">
        </div>
        <div class="col-md-6">
            <h1>Delete {{ pet.name }}?</h1>
            <p>{{ pet.description }}</p>
            <form method="post">
                {% csrf_token %}
                <button class="btn btn-danger" type="submit">Delete</button>
                <a href="{% url 'pet-details' pet.pk %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
{% endblock %}
