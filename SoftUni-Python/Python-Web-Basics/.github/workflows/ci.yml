name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Test every lesson on its own
        run: |
          for lesson in [0-9][0-9][0-9]-*/; do
            echo "::group::$lesson"
            if [ -f "$lesson/manage.py" ]; then
              (cd "$lesson" && python -m venv .venv && .venv/bin/pip install -q -r requirements.txt \
                && .venv/bin/python manage.py makemigrations --check --dry-run \
                && .venv/bin/python manage.py test) || exit 1
            else
              # console tasks: each exercise folder is its own unittest root
              for task in "$lesson"*/; do [ "$(basename "$task")" = Resources ] && continue; (cd "$task" && python -m unittest discover -p "test_*.py") || exit 1; done
            fi
            echo "::endgroup::"
          done
