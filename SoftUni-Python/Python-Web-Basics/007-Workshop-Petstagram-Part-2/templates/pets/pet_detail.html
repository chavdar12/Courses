{% extends 'base.html' %}
{% block content %}
    <div class="row">
        <div class="col-md-6">
            <img src="{{ pet.image_url }}" class="img-fluid rounded" alt="Photo of {{ pet.name }}">
        </div>
        <div class="col-md-6">
            <h1>{{ pet.name }}</h1>
            <p><strong>Type:</strong> {{ pet.type }}</p>
            <p><strong>Age:</strong> {{ pet.age }}</p>
            <p>{{ pet.description }}</p>
            <form method="post" action="{% url 'pet-like' pet.pk %}">
                {% csrf_token %}
                <button class="btn btn-outline-danger">&#10084; Like</button>
                <span class="ms-2">Likes: {{ likes_count }}</span>
            </form>
        </div>
    </div>
{% endblock %}
