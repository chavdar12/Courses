{% extends 'base.html' %}
{% block content %}
    <h1 class="mb-4">All pet photos</h1>
    <div class="row">
        {% for pet in pets %}
            <div class="col-md-4 mb-4">
                <div class="card pet-card">
                    <img src="{{ pet.image_url }}" class="card-img-top" alt="Photo of {{ pet.name }}">
                    <div class="card-body">
                        <h5 class="card-title">{{ pet.name }}, age: {{ pet.age }}</h5>
                        <p class="card-text">{{ pet.description|truncatechars:60 }}</p>
                        <a href="{% url 'pet-details' pet.pk %}" class="btn btn-primary">See details</a>
                    </div>
                </div>
            </div>
        {% empty %}
            <p>There are no pet photos yet.</p>
        {% endfor %}
    </div>
{% endblock %}
