{% extends 'base.html' %}
{% block content %}
    <h1>Delete {{ profile.first_name }} {{ profile.last_name }}?</h1>
    <p>This deletes your profile and all of your expenses.</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Delete</button>
        <a href="{% url 'profile' %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
