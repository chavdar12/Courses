name: Code Scanning

# CodeQL has no PHP support, so Semgrep scans the PHP and uploads its results to GitHub code scanning
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5
      - run: semgrep scan --config p/php --config p/security-audit --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
