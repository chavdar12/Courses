<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Shelter</title>
    <link rel="stylesheet" href="/content/styles/site.css">
</head>
<body>
    <header>
        <nav>
            <ul class="navigation">
                <li><a href="/">Home Page</a></li>
                <li><a href="/cats/add-breed">Add Breed</a></li>
                <li><a href="/cats/add-cat">Add Cat</a></li>
            </ul>
        </nav>
        <h1>Cat Shelter</h1>

    </header>
    <main>
        <form action="/cats/add-cat" method="POST" enctype="multipart/form-data" class="cat-form">
            <h2>Add Cat</h2>
            <p class="error">{{error}}</p>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
            <label for="description">Description</label>
            <textarea id="description" name="description"></textarea>
            <label for="image">Image</label>
            <input type="file" id="image" name="upload" accept="image/*">
            <label for="group">Breed</label>
            <select id="group" name="breed">{{catBreeds}}</select>
            <button type="submit">Add Cat</button>
        </form>
    </main>
</body>
</html>
