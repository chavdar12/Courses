<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Shelter</title>
    <link rel="stylesheet" href="/content/styles/site.css">
</head>
<body>
    <header>
        <nav>
            <ul class="navigation">
                <li><a href="/">Home Page</a></li>
                <li><a href="/cats/add-breed">Add Breed</a></li>
                <li><a href="/cats/add-cat">Add Cat</a></li>
            </ul>
        </nav>
        <h1>Cat Shelter</h1>

    </header>
    <main>
        <form action="/cats/add-breed" method="POST" class="cat-form">
            <h2>Add Cat Breed</h2>
            <p class="error">{{error}}</p>
            <label for="breed-name">Breed Name</label>
            <input type="text" id="breed-name" name="breed" required>
            <button type="submit">Add Breed</button>
        </form>
    </main>
</body>
</html>
