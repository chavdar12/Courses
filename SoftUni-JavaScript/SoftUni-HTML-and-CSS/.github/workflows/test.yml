name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test every exercise on its own
        run: |
          for pkg in $(git ls-files '*package.json'); do
            (cd "$(dirname "$pkg")" && npm ci && npm test) || exit 1
          done
