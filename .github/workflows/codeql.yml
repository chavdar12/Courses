name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # build-mode none: analyses the source without compiling, so one job covers every course of a language
        language: [actions, c-cpp, csharp, java-kotlin, javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
          # the SoftUni Practice Server (MIT, third-party) is bundled verbatim into 25 lessons; it is not our code
          config: |
            paths-ignore:
              - "**/server/server.js"
              - "**/server.cjs"
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
