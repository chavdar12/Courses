name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      projects:
        description: Comma-separated Nx projects to run (empty = every course)
        default: ""

permissions:
  contents: read

jobs:
  # Nx works out which courses a change touched; only those get a job.
  plan:
    runs-on: ubuntu-latest # public repo: hosted runners are free (tools/runners has an optional self-hosted setup)
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: matrix
        env:
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          PROJECTS: ${{ inputs.projects }}
        run: |
          # first push to a branch has no "before": build everything
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then all="${PROJECTS:+--projects=$PROJECTS}"; all="${all:---all}"
          elif [ -n "$BASE_REF" ]; then export NX_BASE=origin/$BASE_REF NX_HEAD=HEAD; all=
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then export NX_BASE=$BEFORE NX_HEAD=HEAD; all=
          else all=--all; fi
          echo "matrix=$(node tools/affected-matrix.mjs $all)" >> "$GITHUB_OUTPUT"

  course:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.matrix).include[0] != null }}
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest # public repo: hosted runners are free (tools/runners has an optional self-hosted setup)
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: contains(matrix.tools, ' java ') || contains(matrix.tools, ' google-java-format ')
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - if: contains(matrix.tools, ' java ')
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.1" # only used by projects without a wrapper
      - if: contains(matrix.tools, ' python ') || contains(matrix.tools, ' ruff ') || contains(matrix.tools, ' sqlfluff ')
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - if: contains(matrix.tools, ' dotnet ') || contains(matrix.tools, ' csharpier ')
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - if: contains(matrix.tools, ' php ') || contains(matrix.tools, ' php-cs-fixer ')
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
      - if: contains(matrix.tools, ' cpp ') || contains(matrix.tools, ' clang-format ')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake g++ clang-format
      # package caches per course: the key changes whenever the course's lockfiles, .csproj files or requirements do
      - uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            ~/.nuget/packages
            ~/.cache/pip
          key: deps-${{ matrix.project }}-${{ hashFiles('package-lock.json', format('{0}/**/package-lock.json', matrix.root), format('{0}/**/*.csproj', matrix.root), format('{0}/**/requirements*.txt', matrix.root)) }}
          restore-keys: deps-${{ matrix.project }}-
      - run: npm ci --no-audit --no-fund
      - run: npx nx run-many -t format test -p "${{ matrix.project }}" --parallel=1 --outputStyle=static # one runner per course: format and test share its temp dir and the .NET first-run setup

  # One stable check for rulesets to require, however many courses ran.
  result:
    needs: [plan, course]
    if: ${{ always() }}
    runs-on: ubuntu-latest # public repo: hosted runners are free (tools/runners has an optional self-hosted setup)
    steps:
      - run: |
          for r in ${{ needs.plan.result }} ${{ needs.course.result }}; do
            case $r in success|skipped) ;; *) echo "a job ended with: $r"; exit 1 ;; esac
          done
