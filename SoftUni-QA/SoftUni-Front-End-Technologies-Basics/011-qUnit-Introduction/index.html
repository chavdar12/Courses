<!DOCTYPE html>
<title>QUnit Demo</title>
<link rel="stylesheet" href="https://code.jquery.com/qunit/qunit-2.21.0.css">

<body>
    <div id="qunit"></div>
    <div id="qunit-fixture"></div>
    <script src="https://code.jquery.com/qunit/qunit-2.21.0.js" integrity="sha384-a3o6k5PhBVHg3NrfvGHw874HcCV3CYQe7SOo0HDoNlio+PpA+fN5QDWuSbPmWwvy" crossorigin="anonymous"></script>
    <script>
        function add(a, b) {
            return a + b;
        }
        QUnit.module('add', function () {
            QUnit.test('two numbers', function (assert) {
                assert.equal(add(1, 2), 3);
            });
        });
    </script>
</body>
