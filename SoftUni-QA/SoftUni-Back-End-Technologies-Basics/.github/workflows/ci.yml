name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  actions: read
  security-events: write
  statuses: write

jobs:
  ci:
    uses: chavdar12/workflows/.github/workflows/ci.yml@v2
    with:
      codeql: '["csharp", "javascript-typescript"]'
      format: 'csharpier prettier'
      build: 'dotnet node'

  docker:
    name: Docker image build
    needs: ci
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.ci.outputs.runner || 'k8s-runners' }}
    steps:
      - uses: actions/checkout@v7

      - name: Build NotesApi image
        run: docker build -f 021-Containers-Docker-and-Docker-Compose/NotesApi/Dockerfile -t notes-api .

      - name: Smoke test container
        run: |
          docker run -d --name notes -p 8080:8080 notes-api
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/health && exit 0
            sleep 1
          done
          docker logs notes
          exit 1
