name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Every module folder is its own solution.
      - run: for s in */*.slnx; do dotnet test "$s"; done

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "*/package-lock.json"
      # Every JS module folder is its own npm project.
      - run: for p in */package.json; do (cd "$(dirname "$p")" && npm ci && npm test); done
