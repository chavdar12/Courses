name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # ubuntu-latest ships Google Chrome; Selenium Manager fetches the matching chromedriver.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Lessons 006 and 015 test SoftUni's Student Registry app, which is no longer hosted; run it locally on port 8080.
      - name: Start Student Registry app
        run: |
          git clone https://github.com/nakov/MVC-app-integration-tests-example-mocha.git "$RUNNER_TEMP/student-registry"
          cd "$RUNNER_TEMP/student-registry"
          git checkout 199394948c8a39edf1b7f0dd386a4aaf5787c6d7
          npm install
          nohup npm start > app.log 2>&1 &
          curl --silent --fail --retry 15 --retry-connrefused --retry-delay 1 http://localhost:8080/ > /dev/null

      # Every lesson folder is its own project (two share the name SeleniumIdeTests), so gather them
      # into a throwaway solution with one folder per project.
      - name: Generate solution
        run: |
          {
            echo '<Solution>'
            git ls-files '*.csproj' | while read -r p; do
              echo "  <Folder Name=\"/$(dirname "$p")/\"><Project Path=\"$GITHUB_WORKSPACE/$p\" /></Folder>"
            done
            echo '</Solution>'
          } > "$RUNNER_TEMP/All.slnx"

      - run: dotnet restore "$RUNNER_TEMP/All.slnx"

      - run: dotnet build "$RUNNER_TEMP/All.slnx" --no-restore --configuration Release

      - run: dotnet test "$RUNNER_TEMP/All.slnx" --no-build --configuration Release --logger "console;verbosity=normal"
