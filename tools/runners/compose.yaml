# Self-hosted runners for Courses CI (runs-on: self-hosted).
#   cp .env.example .env   # put the token in .env
#   docker compose up -d   # 3 runners; each takes one job, exits, and is restarted fresh
#   docker compose down
services:
  runner:
    image: ghcr.io/actions/actions-runner:2.338.2
    env_file: .env
    environment:
      RUNNER_TOOL_CACHE: /opt/hostedtoolcache
      AGENT_TOOLSDIRECTORY: /opt/hostedtoolcache
    volumes:
      - toolcache:/opt/hostedtoolcache # toolchains download once, not per job
    entrypoint:
      - bash
      - -ec
      - |
        sudo chown runner /opt/hostedtoolcache
        token=$$(curl -fsS -X POST -H "Authorization: Bearer $$GITHUB_TOKEN" \
          https://api.github.com/repos/chavdar12/Courses/actions/runners/registration-token | jq -r .token)
        ./config.sh --unattended --url https://github.com/chavdar12/Courses --token "$$token" \
          --name "compose-$$(hostname)" --ephemeral --replace --disableupdate
        exec ./run.sh
    restart: unless-stopped
    deploy:
      replicas: 3

volumes:
  toolcache:
